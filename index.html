<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --g: #00ff41;
        --gdim: #0a7a24;
        --c: #00bfff;
        --w: #ffb000;
        --e: #ff3b30;
        --m: #b48ead;
        --t: 1;
    }
    html, body { height: 100%; }
    body {
        background: #050505;
        color: var(--g);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New",
                     "Microsoft YaHei", "PingFang SC", monospace;
        font-size: 12.5px;
        line-height: 1.5;
        overflow: hidden;
    }
    canvas.matrix { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: .16; }
    #boot { position: relative; z-index: 1; height: 100%; padding: 16px 18px 0; display: flex; flex-direction: column; }
    #head {
        display: flex; justify-content: space-between; align-items: baseline;
        color: var(--gdim); font-size: 10.5px; letter-spacing: .4px;
        border-bottom: 1px solid #0d2a12; padding-bottom: 5px; margin-bottom: 8px; flex: 0 0 auto;
    }
    #head b { color: var(--g); font-weight: 600; }
    #mute { background: none; border: 1px solid #0d2a12; color: var(--gdim); font: inherit; font-size: 10px; padding: 1px 7px; border-radius: 3px; cursor: pointer; }
    #mute:hover { color: var(--g); border-color: var(--gdim); }
    #lines { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 6px; }
    .ln { white-space: pre; overflow: hidden; text-overflow: clip; }
    .ok   { color: var(--g); }
    .inf  { color: var(--c); }
    .warn { color: var(--w); }
    .err  { color: var(--e); }
    .dim  { color: var(--gdim); }
    .mag  { color: var(--m); }
    .k    { color: var(--c); }
    .v    { color: var(--g); }
    .pb   { color: var(--gdim); }
    #barwrap { flex: 0 0 auto; padding: 8px 0 14px; }
    #barmeta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--gdim); margin-bottom: 4px; }
    #phase { color: var(--c); letter-spacing: 1px; }
    #pct { color: var(--g); font-weight: 600; }
    #bar { height: 13px; border: 1px solid #0d3a16; border-radius: 2px; background: #071007; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: repeating-linear-gradient(90deg, var(--g) 0 8px, #00c233 8px 16px); box-shadow: 0 0 12px rgba(0,255,65,.5); transition: width .35s linear; }
    #bar.bad { border-color: #4a0d0d; }
    #bar.bad #fill { background: repeating-linear-gradient(90deg, var(--e) 0 8px, #b3201a 8px 16px); box-shadow: 0 0 12px rgba(255,59,48,.45); }
    #skip { text-align: center; color: #2e4a33; font-size: 10px; margin-top: 6px; }

    #final { position: fixed; inset: 0; z-index: 5; background: #0a0a0a; display: none; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
    #final.on { display: flex; }
    /* 0.4s ≈ 2.5Hz，低于光敏性癫痫 3Hz 安全线 */
    .glitch { font-size: 72px; font-weight: bold; color: #ff0000; text-shadow: 0 0 10px #ff0000, 0 0 40px #ff0000; animation: flicker .4s infinite; }
    @keyframes flicker { 0%,100%{opacity:1;} 50%{opacity:.82;} 25%{transform:skewX(2deg);} 75%{transform:skewX(-2deg);} }
    .sub { color: #00ff00; font-size: 20px; margin-top: 30px; text-shadow: 0 0 5px #00ff00; }
    .ip2 { color: #888; font-size: 14px; margin-top: 20px; }
    .hint { position: fixed; bottom: 14px; left: 0; width: 100%; text-align: center; color: #555; font-size: 12px; }
    @media (max-width: 620px) {
        body { font-size: 10.5px; }
        .glitch { font-size: 40px; }
        .sub { font-size: 15px; margin-top: 20px; }
    }
</style>
</head>
<body>

<canvas class="matrix"></canvas>

<div id="boot">
    <div id="head">
        <span><b>ghost-shell</b> · pacman v7.0.1 · remote session</span>
        <button id="mute" type="button">sound: on</button>
    </div>
    <div id="lines"></div>
    <div id="barwrap">
        <div id="barmeta"><span id="phase">INIT</span><span id="pct">0%</span></div>
        <div id="bar"><div id="fill"></div></div>
        <div id="skip">press any key / click to skip</div>
    </div>
</div>

<div id="final">
    <div class="glitch">YOU GOT HACKED</div>
    <div class="sub">system compromised // access granted</div>
    <div class="ip2" id="ip2"></div>
    <div class="hint">press ESC to exit fullscreen &middot; close the tab to leave</div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
   ghost-shell / pacman 风格伪入侵演示

   边界（别改）：
   1. 一切数据本地采集、本地显示，不发往任何服务器。
      唯一外部请求是查公网 IP 的公开 API，结果只用于显示。
   2. 麦克风：只申请一次权限（浏览器弹真授权框），拿到流立刻 stop 全部 track。
      不录音、不分析、不上传。
   3. 主机名 / 内核地址 / 破坏类命令（delete 文件系統、rm -rf 等）纯属演出。
------------------------------------------------------------------- */

var T = parseFloat(new URLSearchParams(location.search).get('t')) || 1;
function ms(v){ return Math.max(0, Math.round(v * T)); }
function wait(v){ return new Promise(function(r){ setTimeout(r, ms(v)); }); }
function rep(s, n){ var o = ''; for (var i = 0; i < n; i++) o += s; return o; }
/* 显示宽度：CJK / 全角在等宽字体里占 2 列，按字符数补齐会让中英混排行歪掉 */
function dw(s){
    var n = 0;
    for (var i = 0; i < s.length; i++){
        var c = s.charCodeAt(i);
        n += (c >= 0x1100 && (c <= 0x115f || (c >= 0x2e80 && c <= 0xa4cf && c !== 0x303f) ||
              (c >= 0xac00 && c <= 0xd7a3) || (c >= 0xf900 && c <= 0xfaff) ||
              (c >= 0xfe30 && c <= 0xfe6f) || (c >= 0xff00 && c <= 0xff60) ||
              (c >= 0xffe0 && c <= 0xffe6))) ? 2 : 1;
    }
    return n;
}
function padR(s, n){ s = String(s); var d = dw(s); return d >= n ? s : s + rep(' ', n - d); }
function padL(s, n){ s = String(s); var d = dw(s); return d >= n ? s : rep(' ', n - d) + s; }

var NARROW = window.innerWidth < 620;
var BARW = NARROW ? 12 : 22;
var NAMEW = NARROW ? 24 : 38;

/* ---------- 矩阵雨 ---------- */
(function(){
    var cv = document.querySelector('canvas.matrix');
    var ctx = cv.getContext('2d');
    var fs = 14, drops = [];
    function size(){
        cv.width = window.innerWidth; cv.height = window.innerHeight;
        drops = [];
        for (var i = 0; i < cv.width / fs; i++) drops[i] = Math.random() * cv.height;
    }
    size(); window.addEventListener('resize', size);
    setInterval(function(){
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#0f0'; ctx.font = fs + 'px monospace';
        for (var i = 0; i < drops.length; i++){
            ctx.fillText(Math.random() > .5 ? '0' : '1', i * fs, drops[i] * fs);
            if (drops[i] * fs > cv.height && Math.random() > .975) drops[i] = 0;
            drops[i]++;
        }
    }, 55);
})();

/* ---------- 音效 ---------- */
var AC = null, soundOn = true;
function beep(){
    if (!soundOn) return;
    try{
        if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') return;
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = 'square'; o.frequency.value = 620 + Math.random() * 280;
        g.gain.value = 0.015;
        o.connect(g); g.connect(AC.destination);
        o.start(); o.stop(AC.currentTime + 0.02);
    }catch(e){}
}
document.getElementById('mute').addEventListener('click', function(){
    soundOn = !soundOn;
    this.textContent = 'sound: ' + (soundOn ? 'on' : 'off');
});

/* ---------- 终端 ---------- */
var box = document.getElementById('lines');
var fill = document.getElementById('fill'), bar = document.getElementById('bar');
var pctEl = document.getElementById('pct'), phaseEl = document.getElementById('phase');
var pct = 0;
function setPct(v){ pct = Math.max(0, Math.min(100, v)); fill.style.width = pct + '%'; pctEl.textContent = Math.round(pct) + '%'; }
function setPhase(s){ phaseEl.textContent = s; }
function scroll(){ box.scrollTop = box.scrollHeight; }

function mk(cls){
    var ln = document.createElement('div');
    ln.className = 'ln ' + (cls || 'ok');
    box.appendChild(ln); scroll();
    return ln;
}
/* 打字机行 */
function typeLine(text, cls){
    return new Promise(function(res){
        var ln = mk(cls), i = 0;
        (function step(){
            if (i >= text.length) return res();
            ln.textContent += text.charAt(i++);
            if (i % 3 === 0) beep();
            scroll();
            setTimeout(step, ms(8));
        })();
    });
}
/* pacman 式进度块 */
function barStr(i){
    return '[' + rep('#', i) + rep('-', BARW - i) + '] ' + padL(Math.round(i / BARW * 100), 3) + '%';
}
/* 一行：左侧固定文字 + 右侧 [####] 走到 100% */
async function pacRow(left, cls){
    var ln = mk(cls || 'ok');
    var l = document.createElement('span'); l.className = 'pn';
    var b = document.createElement('span'); b.className = 'pb';
    ln.appendChild(l); ln.appendChild(b);
    l.textContent = (NARROW ? left : padR(left, NAMEW)) + ' ';
    b.textContent = barStr(0);
    scroll();
    var steps = NARROW ? 7 : 9;
    for (var i = 1; i <= steps; i++){
        await wait(28);
        if (skipped) { b.textContent = barStr(BARW); return; }
        b.textContent = barStr(Math.round(BARW * i / steps));
        beep();
    }
}
/* 下载行：名字 + 大小 + 速度 + ETA + 进度块 */
async function dlRow(name, size, speed, eta, cls){
    var left = NARROW ? name : padR(name, 33) + ' ' + padL(size, 9) + ' ' + padL(speed, 11) + ' ' + padL(eta, 5);
    await pacRow(left, cls);
}
/* key :: value 行（真信息用） */
function kv(k, v, cls){
    return typeLine('   ' + padR(k, NARROW ? 8 : 11) + ':: ' + v, cls || '');
}

/* ---------- 真实采集 ---------- */
var R = {};
function withTimeout(p, t){
    return Promise.race([p, new Promise(function(r){ setTimeout(function(){ r(null); }, t); })]);
}
function hash(s){ var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(16).toUpperCase(); }
function ua(){
    var s = navigator.userAgent, os = 'unknown', br = 'unknown';
    if (/Windows NT 10/.test(s)) os = 'Windows 10/11';
    else if (/Windows/.test(s)) os = 'Windows';
    else if (/Android/.test(s)) os = 'Android ' + (s.match(/Android ([\d.]+)/) || [,''])[1];
    else if (/iPhone|iPad/.test(s)) os = 'iOS ' + ((s.match(/OS (\d+)/) || [,''])[1] || '').replace('_','.');
    else if (/Mac OS X/.test(s)) os = 'macOS';
    else if (/Linux/.test(s)) os = 'Linux';
    if (/Edg\//.test(s)) br = 'Edge ' + (s.match(/Edg\/([\d.]+)/) || [,''])[1];
    else if (/Chrome\//.test(s)) br = 'Chrome ' + ((s.match(/Chrome\/(\d+)/) || [,''])[1]) ;
    else if (/Firefox\//.test(s)) br = 'Firefox ' + (s.match(/Firefox\/([\d.]+)/) || [,''])[1];
    else if (/Safari\//.test(s)) br = 'Safari';
    return { os: os, br: br };
}
function gpu(){
    try{
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) return 'n/a';
        var d = gl.getExtension('WEBGL_debug_renderer_info');
        return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    }catch(e){ return 'n/a'; }
}
function canvasFp(){
    try{
        var c = document.createElement('canvas'); c.width = 240; c.height = 64;
        var x = c.getContext('2d');
        x.textBaseline = 'top';
        x.fillStyle = '#f60'; x.fillRect(0, 0, 120, 22);
        x.fillStyle = '#06f'; x.font = '15px Arial'; x.fillText('ghost-shell ▓ 0123', 4, 26);
        x.fillStyle = 'rgba(0,255,65,.6)'; x.fillRect(20, 44, 90, 12);
        return '0x' + hash(c.toDataURL()).slice(0, 8).toUpperCase();
    }catch(e){ return 'n/a'; }
}
/* 用 canvas 量文本宽度比对，避开 document.fonts.check 对未装字体也返回 true 的坑 */
function fonts(){
    var tests = ['Microsoft YaHei','SimSun','PingFang SC','Hiragino Sans GB','Helvetica Neue','Arial Black','Consolas','Menlo','Impact','Tahoma','Georgia','Courier New'];
    var bases = ['monospace','sans-serif','serif'], probe = 'mmmmmmmmmmlliWW@', size = '72px';
    try{
        var c = document.createElement('canvas').getContext('2d');
        function w(f){ c.font = size + ' ' + f; return c.measureText(probe).width; }
        var ref = {}; bases.forEach(function(b){ ref[b] = w(b); });
        var hit = [];
        tests.forEach(function(f){ if (bases.some(function(b){ return w('"' + f + '",' + b) !== ref[b]; })) hit.push(f); });
        return hit.length + '/' + tests.length + ' (' + (hit.slice(0, 3).join(', ') || 'none') + ')';
    }catch(e){ return 'n/a'; }
}
function battery(){
    try{
        if (!navigator.getBattery) return Promise.resolve('n/a');
        return navigator.getBattery().then(function(b){ return Math.round(b.level * 100) + '% ' + (b.charging ? '(charging)' : '(on battery)'); }).catch(function(){ return 'n/a'; });
    }catch(e){ return Promise.resolve('n/a'); }
}
function lanIp(){
    return new Promise(function(res){
        try{
            var C = window.RTCPeerConnection || window.webkitRTCPeerConnection;
            if (!C) return res('n/a');
            var pc = new C({ iceServers: [] });
            pc.createDataChannel('x');
            pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).catch(function(){});
            var found = [];
            pc.onicecandidate = function(e){
                if (e && e.candidate && e.candidate.candidate){
                    var m = /([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
                    if (m && found.indexOf(m[1]) < 0) found.push(m[1]);
                }
            };
            setTimeout(function(){ try{ pc.close(); }catch(e){} res(found.length ? found.slice(0,2).join(', ') : 'masked (.local)'); }, 1200);
        }catch(e){ res('n/a'); }
    });
}
function pubIp(){
    var apis = ['https://api.ipify.org?format=json','https://api64.ipify.org?format=json','https://ipapi.co/json/'], i = 0;
    function next(){
        if (i >= apis.length) return Promise.resolve('unavailable');
        var u = apis[i++];
        return withTimeout(fetch(u, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
            return (j.ip || j.query || 'unavailable') + (j.city ? ' ~' + j.city : '');
        }).catch(next), 3500);
    }
    return next();
}
function devices(){
    try{
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve({});
        return withTimeout(navigator.mediaDevices.enumerateDevices().then(function(ds){
            var o = {};
            ds.forEach(function(d){
                if (!d.label) return;
                (o[d.kind] = o[d.kind] || []);
                if (o[d.kind].indexOf(d.label) < 0) o[d.kind].push(d.label);
            });
            return o;
        }).catch(function(){ return {}; }), 2500);
    }catch(e){ return Promise.resolve({}); }
}
/* 只申请，拿到立刻关。不录音、不分析、不上传。 */
function mic(){
    return new Promise(function(res){
        try{
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return res({ ok:false, why:'unsupported' });
            var t = setTimeout(function(){ res({ ok:false, why:'timeout' }); }, 12000);
            navigator.mediaDevices.getUserMedia({ audio:true }).then(function(st){
                clearTimeout(t);
                st.getTracks().forEach(function(tr){ tr.stop(); });
                res({ ok:true });
            }).catch(function(err){ clearTimeout(t); res({ ok:false, why:(err && err.name) || 'denied' }); });
        }catch(e){ res({ ok:false, why:'error' }); }
    });
}
var PERMS = ['geolocation','notifications','camera','microphone','midi','clipboard-read','clipboard-write','bluetooth','usb','serial','hid','persistent-storage','background-sync'];
function permState(n){
    try{
        if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve('n/a');
        return navigator.permissions.query({ name:n }).then(function(s){ return s.state; }).catch(function(){ return 'n/a'; });
    }catch(e){ return Promise.resolve('n/a'); }
}
function collectAll(){
    var U = ua();
    R.os = U.os; R.br = U.br;
    R.screen = window.screen.width + '×' + window.screen.height + ' @' + (window.devicePixelRatio || 1) + 'x, ' + (window.screen.colorDepth || '?') + '-bit';
    R.cores = navigator.hardwareConcurrency || '?';
    R.mem = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'undisclosed';
    R.gpu = gpu(); R.canvas = canvasFp(); R.fonts = fonts();
    R.tz = (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return 'n/a'; } })();
    R.lang = navigator.language || 'n/a';
    R.touch = ('maxTouchPoints' in navigator ? navigator.maxTouchPoints : 0);
    R.conn = (function(){
        var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!c) return 'n/a';
        return [c.effectiveType, c.downlink ? c.downlink + 'Mb/s' : '', c.rtt ? c.rtt + 'ms RTT' : ''].filter(Boolean).join(' · ');
    })();
    R.online = navigator.onLine ? 'online' : 'offline';
    R.host = 'DESKTOP-' + hash(navigator.userAgent + R.screen).slice(0, 6);
    return Promise.all([
        withTimeout(lanIp(), 2000).then(function(v){ R.lan = v; }),
        withTimeout(pubIp(), 4000).then(function(v){ R.pub = v; }),
        withTimeout(battery(), 2500).then(function(v){ R.batt = v; }),
        withTimeout(Promise.all(PERMS.map(permState)), 3000).then(function(v){ R.perms = v; })
    ]).catch(function(){});
}

/* ---------- 跳过 / 最终页 ---------- */
var skipped = false;
function skip(){ if (skipped) return; skipped = true; setPct(100); showFinal(); }
window.addEventListener('keydown', skip);
window.addEventListener('pointerdown', function(e){ if (e.target && e.target.id === 'mute') return; skip(); });
function showFinal(){
    document.getElementById('boot').style.display = 'none';
    document.getElementById('ip2').textContent = 'session started: ' + new Date().toLocaleString();
    var f = document.getElementById('final');
    f.classList.add('on');
    f.addEventListener('click', function(){
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    });
}

/* ---------- 剧本 ---------- */
async function run(){
    await collectAll();
    if (skipped) return;

    setPhase('SYNC');
    await typeLine('[✓] 建立 encrypted tunnel :: TLS1.3 / AES-256-GCM', 'inf');
    setPct(5);
    await typeLine(':: Synchronizing 目標設備 databases...', 'inf');
    await dlRow(' core', '132.7 KiB', '1810 KiB/s', '00:00');
    await dlRow(' extra', '8.3 MiB', '2.31 MiB/s', '00:04');
    await dlRow(' community', '5.1 MiB', '3.05 MiB/s', '00:02');
    setPct(12);
    await pacRow(':: 正在解析 dependencies', 'inf');
    await pacRow(':: 检查 文件衝突 file-conflicts', 'inf');

    if (skipped) return;
    setPhase('RESOLVE');
    await typeLine('', '');
    await typeLine('Packages (9) os-fingerprint-2.7.1-1  display-probe-1.4.0-2  mic-capture-0.9.3-1', 'mag');
    await typeLine('            fp-canvas-1.4.2-1  netmap-webrtc-1.1.0-2  power-battery-0.3.1-1', 'mag');
    await typeLine('            audio-enum-2.0.0-1  payload-kernel-4.2.0-1', 'mag');
    await typeLine('            GGB蠕虫installing.js.happy.AprilFoolDay-1.4-1', 'mag');
    await typeLine('', '');
    await typeLine('Total Download Size:      4.19 MiB', 'dim');
    await typeLine('Total Installed Size:    18.77 MiB', 'dim');
    setPct(20);
    await typeLine('', '');
    await typeLine(':: Proceed with installation? [Y/n] y', 'inf');

    if (skipped) return;
    setPhase('RETRIEVE');
    await typeLine(':: Retrieving packages...', 'inf');
    await dlRow(' os-fingerprint-2.7.1-1-x86_64', '512.0 KiB', '8.10 MiB/s', '00:00');
    await dlRow(' display-probe-1.4.0-2-x86_64', '88.4 KiB', '1204 KiB/s', '00:00');
    await dlRow(' mic-capture-0.9.3-1-any', '120.0 KiB', '2022 KiB/s', '00:00');
    await dlRow(' fp-canvas-1.4.2-1-any', '44.1 KiB', '1510 KiB/s', '00:00');
    setPct(32);
    await dlRow(' netmap-webrtc-1.1.0-2-x86_64', '310.5 KiB', '4.40 MiB/s', '00:00');
    await dlRow(' power-battery-0.3.1-1-any', '18.9 KiB', '902 KiB/s', '00:00');
    await dlRow(' audio-enum-2.0.0-1-any', '76.2 KiB', '1.90 MiB/s', '00:00');
    setPct(40);
    await dlRow(' payload-kernel-4.2.0-1-x86_64', '2.1 MiB', '6.60 MiB/s', '00:01');
    await dlRow(' GGB蠕虫installing.js.happy.AprilFoolDay', '1.4 KiB', '404 KiB/s', '00:00', 'mag');
    setPct(46);

    await typeLine('', '');
    await pacRow(':: checking keyring', 'inf');
    await pacRow(':: checking package integrity', 'inf');
    await pacRow(':: loading package files', 'inf');
    await pacRow(':: checking for file 衝突 conflicts', 'inf');
    await pacRow(':: checking available disk space', 'inf');

    if (skipped) return;
    setPhase('INSTALL');
    await typeLine(':: Processing package changes...', 'inf');
    setPct(52);
    await pacRow('(1/9) installing os-fingerprint');
    await kv('系統', R.os + ' · ' + R.br);
    await kv('内核', R.host + ' :: uid=0 :: root');
    await kv('語言', R.lang + ' :: ' + R.tz);
    setPct(58);
    await pacRow('(2/9) installing display-probe');
    await kv('分辨率', R.screen);
    await kv('處理器', R.cores + ' logical cores, mem ' + R.mem);
    await kv('顯卡', R.gpu);
    await kv('電量', R.batt || 'n/a');
    setPct(64);
    await pacRow('(3/9) installing fp-canvas');
    await kv('畫布指紋', R.canvas);
    await kv('字體', R.fonts);
    await kv('觸摸', R.touch + ' touch points');

    if (skipped) return;
    setPhase('NETWORK');
    await pacRow('(4/9) installing netmap-webrtc');
    await kv('公網IP', R.pub || 'unavailable');
    await kv('内網IP', R.lan || 'n/a');
    await kv('鏈路', R.online + ' :: ' + R.conn);
    setPct(71);
    await pacRow('(5/9) installing audio-enum');
    var dv = await devices();
    var outs = dv.audiooutput || [], ins = dv.audioinput || [], cams = dv.videoinput || [];
    await kv('揚聲器', outs.length ? outs[0].slice(0, 44) : 'not disclosed');
    await kv('輸入設備', ins.length ? ins[0].slice(0, 44) : 'not disclosed');
    await kv('攝像頭', cams.length ? cams.length + ' camera(s) present' : 'none disclosed');

    if (skipped) return;
    setPhase('CAPTURE');
    await typeLine(':: requesting 麥克風 audio control', 'inf');
    var m = await mic();
    await pacRow('(6/9) installing mic-capture');
    await kv('麥克風', m.ok ? 'CAPTURED :: stream acquired' : m.why);
    setPct(78);

    /* 权限矩阵 */
    await typeLine(':: scanning 權限矩陣 permission matrix', 'inf');
    var arr = R.perms || [];
    for (var i = 0; i < PERMS.length; i++){
        if (skipped) return;
        var st = arr[i] || 'n/a';
        var tag = st === 'granted' ? 'GRANTED' : (st === 'denied' ? 'BLOCKED' : 'PROMPT');
        var cls = st === 'granted' ? 'ok' : (st === 'denied' ? 'dim' : 'inf');
        await pacRow('   ' + padR(PERMS[i], 20) + tag, cls);
        setPct(78 + (i + 1) / PERMS.length * 8);
    }

    if (skipped) return;
    setPhase('ESCALATION');
    await typeLine(':: loading 内核載荷 kernel payload :: 0x7FFE3A1C', 'inf');
    bar.classList.add('bad');
    await typeLine('(7/9) installing payload-kernel', 'err');
    await typeLine('error: failed to commit transaction (權限不足 / Permission denied)', 'err');
    await wait(600);
    await typeLine('error: failed to install payload-kernel (沙箱拒絕 / sandbox denied)', 'err');
    await wait(500);
    bar.classList.remove('bad');
    setPct(88);
    await typeLine(':: retrying with fallback vector ... attempt 2/3', 'warn');
    await wait(400);
    await pacRow('(7/9) installing payload-kernel');
    await typeLine('warning: sandbox bypassed (simulated)', 'warn');
    setPct(93);

    await pacRow('(8/9) installing AprilFoolDay 彩蛋');
    await typeLine('   happy AprilFoolDay :: GGB蠕虫 installed', 'mag');
    await pacRow('(9/9) installing post-hooks');

    if (skipped) return;
    setPhase('HOOKS');
    await typeLine(':: Running post-transaction hooks...', 'inf');
    await pacRow(':: delete Microsoft 文件系統', 'warn');
    await pacRow(':: rm -rf /System32 驅動程序', 'warn');
    await pacRow(':: chmod 777 使用者隱私', 'warn');
    await pacRow(':: 上傳 user data -> 0x7FFE3A1C', 'warn');
    setPct(98);
    await typeLine('', '');
    await typeLine(':: Done.', 'ok');
    setPct(100);
    setPhase('COMPLETE');
    await wait(700);
    if (!skipped){ skipped = true; showFinal(); }
}

run().catch(function(){ if (!skipped){ skipped = true; setPct(100); showFinal(); } });
</script>
