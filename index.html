<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --g: #00ff41;
        --g-dim: #0a7a24;
        --c: #00bfff;
        --w: #ffb000;
        --e: #ff3b30;
        --t: 1; /* 节奏倍率，?t=0.15 可加速演示 */
    }
    html, body { height: 100%; }
    body {
        background: #050505;
        color: var(--g);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
        font-size: 13px;
        line-height: 1.55;
        overflow: hidden;
    }
    canvas.matrix {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: .18;
    }
    #boot {
        position: relative; z-index: 1;
        height: 100%;
        padding: 18px 20px 0;
        display: flex; flex-direction: column;
    }
    #head {
        display: flex; justify-content: space-between; align-items: baseline;
        color: var(--g-dim); font-size: 11px; letter-spacing: .5px;
        border-bottom: 1px solid #0d2a12;
        padding-bottom: 6px; margin-bottom: 10px;
        flex: 0 0 auto;
    }
    #head b { color: var(--g); font-weight: 600; }
    #mute {
        background: none; border: 1px solid #0d2a12; color: var(--g-dim);
        font: inherit; font-size: 10px; padding: 1px 7px; border-radius: 3px;
        cursor: pointer;
    }
    #mute:hover { color: var(--g); border-color: var(--g-dim); }
    #lines {
        flex: 1 1 auto; overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end;
        padding-bottom: 8px;
    }
    .ln { white-space: pre-wrap; word-break: break-all; }
    .ln .zh {
        color: #4d6b52; font-size: 11.5px;
        display: block; padding-left: 16px;
    }
    .ok  { color: var(--g); }
    .inf { color: var(--c); }
    .warn{ color: var(--w); }
    .err { color: var(--e); }
    .dim { color: var(--g-dim); }
    .cur { color: var(--g); }
    #barwrap { flex: 0 0 auto; padding: 10px 0 16px; }
    #barmeta {
        display: flex; justify-content: space-between;
        font-size: 11px; color: var(--g-dim); margin-bottom: 5px;
    }
    #phase { color: var(--c); letter-spacing: 1px; }
    #pct { color: var(--g); font-weight: 600; }
    #bar {
        height: 14px; border: 1px solid #0d3a16; border-radius: 2px;
        background: #071007; overflow: hidden; position: relative;
    }
    #fill {
        height: 100%; width: 0%;
        background: repeating-linear-gradient(90deg, var(--g) 0 8px, #00c233 8px 16px);
        box-shadow: 0 0 12px rgba(0,255,65,.55);
        transition: width .35s linear;
    }
    #bar.bad { border-color: #4a0d0d; }
    #bar.bad #fill { background: repeating-linear-gradient(90deg, var(--e) 0 8px, #b3201a 8px 16px); box-shadow: 0 0 12px rgba(255,59,48,.5); }
    #skip { text-align: center; color: #2e4a33; font-size: 10.5px; margin-top: 7px; }

    /* ---------- 最终页 ---------- */
    #final {
        position: fixed; inset: 0; z-index: 5;
        background: #0a0a0a;
        display: none; flex-direction: column;
        justify-content: center; align-items: center;
        overflow: hidden;
    }
    #final.on { display: flex; }
    /* 0.4s ≈ 2.5Hz，低于光敏性癫痫 3Hz 安全线；原 0.15s(6.7Hz) 有真实风险 */
    .glitch {
        font-size: 72px; font-weight: bold; color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 40px #ff0000;
        animation: flicker .4s infinite;
    }
    @keyframes flicker {
        0%,100% { opacity: 1; }
        50% { opacity: .82; }
        25% { transform: skewX(2deg); }
        75% { transform: skewX(-2deg); }
    }
    .sub { color: #00ff00; font-size: 20px; margin-top: 30px; text-shadow: 0 0 5px #00ff00; }
    .ip2 { color: #888; font-size: 14px; margin-top: 20px; }
    .hint {
        position: fixed; bottom: 14px; left: 0; width: 100%;
        text-align: center; color: #555; font-size: 12px;
    }
    @media (max-width: 520px) {
        body { font-size: 11.5px; }
        .glitch { font-size: 40px; }
        .sub { font-size: 15px; margin-top: 20px; }
        .ln .zh { font-size: 10.5px; }
    }
</style>
</head>
<body>

<canvas class="matrix"></canvas>

<div id="boot">
    <div id="head">
        <span><b>ghost-shell</b> v2.7.1 &middot; remote session</span>
        <button id="mute" type="button">sound: on</button>
    </div>
    <div id="lines"></div>
    <div id="barwrap">
        <div id="barmeta">
            <span id="phase">INIT</span>
            <span id="pct">0%</span>
        </div>
        <div id="bar"><div id="fill"></div></div>
        <div id="skip">press any key / click to skip</div>
    </div>
</div>

<div id="final">
    <div class="glitch">YOU GOT HACKED</div>
    <div class="sub">system compromised // access granted</div>
    <div class="ip2" id="ip2"></div>
    <div class="hint">press ESC to exit fullscreen &middot; close the tab to leave</div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
   ghost-shell —— 伪入侵演示页

   边界（很重要，别改）：
   1. 一切数据只在本地采集、本地显示，不发往任何服务器。
      唯一外部请求是查询公网 IP 的公开 API，结果也只是显示出来。
   2. 麦克风：只向浏览器申请一次权限（为了让浏览器弹真实的授权框），
      拿到流之后立刻 stop 所有 track。不录音、不分析、不上传。
   3. 主机名 / 管理员 / 内存地址 / 载荷 全是编的，中文里已标注「伪造」。
------------------------------------------------------------------- */

/* ---------- 节奏控制 ---------- */
var T = parseFloat(new URLSearchParams(location.search).get('t')) || 1;
function ms(v){ return Math.max(0, Math.round(v * T)); }
function wait(v){ return new Promise(function(r){ setTimeout(r, ms(v)); }); }

/* ---------- 矩阵雨 ---------- */
(function(){
    var cv = document.querySelector('canvas.matrix');
    var ctx = cv.getContext('2d');
    var fs = 14, drops = [];
    function size(){
        cv.width = window.innerWidth; cv.height = window.innerHeight;
        drops = [];
        for (var i = 0; i < cv.width / fs; i++) drops[i] = Math.random() * cv.height;
    }
    size();
    window.addEventListener('resize', size);
    setInterval(function(){
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#0f0'; ctx.font = fs + 'px monospace';
        for (var i = 0; i < drops.length; i++){
            ctx.fillText(Math.random() > .5 ? '0' : '1', i * fs, drops[i] * fs);
            if (drops[i] * fs > cv.height && Math.random() > .975) drops[i] = 0;
            drops[i]++;
        }
    }, 55);
})();

/* ---------- 轻量音效（首次交互后才可能出声，浏览器策略如此） ---------- */
var AC = null, soundOn = true;
function beep(){
    if (!soundOn) return;
    try{
        if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') return;
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = 'square';
        o.frequency.value = 600 + Math.random() * 300;
        g.gain.value = 0.015;
        o.connect(g); g.connect(AC.destination);
        o.start(); o.stop(AC.currentTime + 0.02);
    }catch(e){}
}
document.getElementById('mute').addEventListener('click', function(){
    soundOn = !soundOn;
    this.textContent = 'sound: ' + (soundOn ? 'on' : 'off');
});

/* ---------- 终端输出 ---------- */
var box = document.getElementById('lines');
var fill = document.getElementById('fill'), bar = document.getElementById('bar');
var pctEl = document.getElementById('pct'), phaseEl = document.getElementById('phase');
var pct = 0;

function setPct(v){
    pct = Math.max(0, Math.min(100, v));
    fill.style.width = pct + '%';
    pctEl.textContent = Math.round(pct) + '%';
}
function setPhase(s){ phaseEl.textContent = s; }
function scroll(){ box.scrollTop = box.scrollHeight; }

function pad(s, n){
    s = String(s);
    while (s.length < n) s += '.';
    return s;
}

/* 逐字打字机；中文解释整段淡入，不逐字，否则太慢 */
function typeLine(en, zh, cls){
    return new Promise(function(resolve){
        var ln = document.createElement('div');
        ln.className = 'ln ' + (cls || 'ok');
        var span = document.createElement('span');
        ln.appendChild(span);
        box.appendChild(ln);
        scroll();
        var i = 0;
        (function step(){
            if (i >= en.length){
                if (zh){
                    var z = document.createElement('span');
                    z.className = 'zh';
                    z.textContent = '└ ' + zh;
                    ln.appendChild(z);
                    scroll();
                }
                return resolve();
            }
            span.textContent += en.charAt(i++);
            if (i % 3 === 0) beep();
            scroll();
            setTimeout(step, ms(9));
        })();
    });
}

/* ---------- 真实采集：全部 try/catch + 超时，任何一项失败都不能卡住 ---------- */
var R = {};
function withTimeout(p, t){
    return Promise.race([p, new Promise(function(r){ setTimeout(function(){ r(null); }, t); })]);
}
function hash(s){
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(16).toUpperCase().padStart(8, '0');
}
function ua(){
    var s = navigator.userAgent, os = 'unknown', br = 'unknown';
    if (/Windows NT 10/.test(s)) os = 'Windows 10/11';
    else if (/Windows/.test(s)) os = 'Windows';
    else if (/Android/.test(s)) os = 'Android ' + (s.match(/Android ([\d.]+)/) || [,''])[1];
    else if (/iPhone|iPad/.test(s)) os = 'iOS ' + (s.match(/OS (\d+)/) || [,''])[1].replace('_','.');
    else if (/Mac OS X/.test(s)) os = 'macOS';
    else if (/Linux/.test(s)) os = 'Linux';
    if (/Edg\//.test(s)) br = 'Edge ' + (s.match(/Edg\/([\d.]+)/) || [,''])[1];
    else if (/Chrome\//.test(s)) br = 'Chrome ' + (s.match(/Chrome\/([\d.]+)/) || [,''])[1];
    else if (/Firefox\//.test(s)) br = 'Firefox ' + (s.match(/Firefox\/([\d.]+)/) || [,''])[1];
    else if (/Safari\//.test(s)) br = 'Safari';
    return { os: os, br: br };
}
function gpu(){
    try{
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) return 'n/a';
        var d = gl.getExtension('WEBGL_debug_renderer_info');
        return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    }catch(e){ return 'n/a'; }
}
function canvasFp(){
    try{
        var c = document.createElement('canvas'); c.width = 240; c.height = 64;
        var x = c.getContext('2d');
        x.textBaseline = 'top';
        x.fillStyle = '#f60'; x.fillRect(0, 0, 120, 22);
        x.fillStyle = '#06f'; x.font = '15px Arial'; x.fillText('ghost-shell ▓ 0123', 4, 26);
        x.fillStyle = 'rgba(0,255,65,.6)'; x.fillRect(20, 44, 90, 12);
        return hash(c.toDataURL());
    }catch(e){ return 'n/a'; }
}
function audioFp(){
    try{
        var C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!C) return 'n/a';
        var ac = new C(1, 44100, 44100), o = ac.createOscillator();
        o.type = 'triangle'; o.frequency.value = 10000;
        o.connect(ac.destination); o.start(0);
        var s = ac.startRendering ? ac.startRendering() : null;
        return s && s.then ? 'queued' : 'n/a';
    }catch(e){ return 'n/a'; }
}
/* 用 canvas 量文本宽度对比，而不是 document.fonts.check —— 后者对没装的字体也会
   返回 true（它会 fallback），测出来全是命中，等于没测。 */
function fonts(){
    var tests = ['Microsoft YaHei','SimSun','PingFang SC','Hiragino Sans GB','Helvetica Neue',
                 'Arial Black','Consolas','Menlo','Impact','Tahoma','Georgia','Courier New'];
    var bases = ['monospace','sans-serif','serif'];
    var probe = 'mmmmmmmmmmlliWW@', size = '72px';
    try{
        var c = document.createElement('canvas').getContext('2d');
        function w(f){ c.font = size + ' ' + f; return c.measureText(probe).width; }
        var ref = {};
        bases.forEach(function(b){ ref[b] = w(b); });
        var hit = [];
        tests.forEach(function(f){
            if (bases.some(function(b){ return w('"' + f + '",' + b) !== ref[b]; })) hit.push(f);
        });
        return hit.length + '/' + tests.length + ' :: ' + (hit.slice(0, 3).join(', ') || 'none');
    }catch(e){ return 'n/a'; }
}
function battery(){
    try{
        if (!navigator.getBattery) return Promise.resolve('n/a');
        return navigator.getBattery().then(function(b){
            return Math.round(b.level * 100) + '% ' + (b.charging ? '(charging)' : '(on battery)');
        }).catch(function(){ return 'n/a'; });
    }catch(e){ return Promise.resolve('n/a'); }
}
function lanIp(){
    return new Promise(function(res){
        try{
            var C = window.RTCPeerConnection || window.webkitRTCPeerConnection;
            if (!C) return res('n/a');
            var pc = new C({ iceServers: [] });
            pc.createDataChannel('x');
            pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).catch(function(){ res('n/a'); });
            var found = [];
            pc.onicecandidate = function(e){
                if (e && e.candidate && e.candidate.candidate){
                    var m = /([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
                    if (m && found.indexOf(m[1]) < 0) found.push(m[1]);
                }
            };
            setTimeout(function(){
                try{ pc.close(); }catch(e){}
                res(found.length ? found.slice(0, 2).join(', ') : 'masked (.local)');
            }, 1200);
        }catch(e){ res('n/a'); }
    });
}
function pubIp(){
    var apis = ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json', 'https://ipapi.co/json/'];
    var i = 0;
    function next(){
        if (i >= apis.length) return Promise.resolve('unavailable');
        var u = apis[i++];
        return withTimeout(
            fetch(u, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
                return (j.ip || j.query || 'unavailable') + (j.city ? '  ~' + j.city : '');
            }).catch(next), 3500
        );
    }
    return next();
}
function devices(){
    try{
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve([]);
        return withTimeout(navigator.mediaDevices.enumerateDevices().then(function(ds){
            var out = {};
            ds.forEach(function(d){
                if (!d.label) return;
                (out[d.kind] = out[d.kind] || []);
                if (out[d.kind].indexOf(d.label) < 0) out[d.kind].push(d.label);
            });
            return out;
        }).catch(function(){ return []; }), 2500);
    }catch(e){ return Promise.resolve([]); }
}
function mic(){
    /* 只申请一次权限，拿到后立刻关闭。不录音、不分析、不上传。 */
    return new Promise(function(res){
        try{
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return res({ ok: false, why: 'unsupported' });
            var t = setTimeout(function(){ res({ ok: false, why: 'timeout' }); }, 12000);
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(st){
                clearTimeout(t);
                st.getTracks().forEach(function(tr){ tr.stop(); });   // 立即停止
                res({ ok: true });
            }).catch(function(err){
                clearTimeout(t);
                res({ ok: false, why: (err && err.name) || 'denied' });
            });
        }catch(e){ res({ ok: false, why: 'error' }); }
    });
}
var PERMS = ['geolocation','notifications','camera','microphone','midi','clipboard-read',
             'clipboard-write','bluetooth','usb','serial','hid','persistent-storage','background-sync'];
function permState(name){
    try{
        if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve('n/a');
        return navigator.permissions.query({ name: name })
            .then(function(s){ return s.state; })
            .catch(function(){ return 'n/a'; });
    }catch(e){ return Promise.resolve('n/a'); }
}

/* ---------- 预采集（并行、有超时，剧本播放时不会卡） ---------- */
function collectAll(){
    var U = ua();
    R.os = U.os; R.br = U.br;
    R.screen = window.screen.width + '×' + window.screen.height + ' @' + (window.devicePixelRatio || 1) + 'x, ' + (window.screen.colorDepth || '?') + '-bit';
    R.cores = navigator.hardwareConcurrency || '?';
    R.mem = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : (navigator.deviceMemory === 0 ? '0' : 'undisclosed');
    R.gpu = gpu();
    R.canvas = canvasFp();
    R.audio = audioFp();
    R.fonts = fonts();
    R.tz = (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return 'n/a'; } })();
    R.lang = navigator.language || 'n/a';
    R.langs = (navigator.languages || []).slice(0, 3).join(' ');
    R.touch = ('maxTouchPoints' in navigator ? navigator.maxTouchPoints : 0);
    R.conn = (function(){
        var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!c) return 'n/a';
        return [c.effectiveType, c.downlink ? c.downlink + ' Mb/s' : '', c.rtt ? c.rtt + 'ms RTT' : ''].filter(Boolean).join(' · ');
    })();
    R.online = navigator.onLine ? 'online' : 'offline';
    R.host = 'DESKTOP-' + hash(navigator.userAgent + R.screen).slice(0, 6);
    R.admin = /Windows/.test(navigator.userAgent) ? 'NT AUTHORITY\\SYSTEM' : 'root';
    return Promise.all([
        withTimeout(lanIp(), 2000).then(function(v){ R.lan = v; }),
        withTimeout(pubIp(), 4000).then(function(v){ R.pub = v; }),
        withTimeout(battery(), 2500).then(function(v){ R.batt = v; }),
        withTimeout(Promise.all(PERMS.map(permState)), 3000).then(function(v){ R.perms = v; })
    ]).catch(function(){});
}

/* ---------- 剧本 ---------- */
var skipped = false;
function skip(){
    if (skipped) return;
    skipped = true;
    setPct(100);
    showFinal();
}
window.addEventListener('keydown', skip, { once: false });
window.addEventListener('pointerdown', function(e){
    if (e.target && e.target.id === 'mute') return;
    skip();
}, { once: false });

function showFinal(){
    document.getElementById('boot').style.display = 'none';
    document.getElementById('ip2').textContent = 'session started: ' + new Date().toLocaleString();
    var f = document.getElementById('final');
    f.classList.add('on');
    f.addEventListener('click', function(){
        if (!document.fullscreenElement && document.documentElement.requestFullscreen){
            document.documentElement.requestFullscreen().catch(function(){});
        }
    });
}

async function run(){
    await collectAll();
    if (skipped) return;

    setPhase('RECON');
    await typeLine('[·] establishing secure channel ......... TLS1.3 / AES-256-GCM',
                   '加密通道 · 真的，你现在上的就是 https', 'inf');
    setPct(7);
    await typeLine('[✓] host identity resolved ............. ' + R.host,
                   '主机名 · 伪造，浏览器拿不到真实主机名');
    setPct(13);
    await typeLine('[✓] privilege level .................... ' + R.admin + ' (uid=0)',
                   '管理员权限 · 伪造，浏览器永远拿不到系统权限');
    setPct(19);
    await typeLine('[✓] os / runtime ....................... ' + R.os + ' · ' + R.br,
                   '系统与浏览器 · 真的，来自 UA 指纹');
    await typeLine('[✓] display matrix ..................... ' + R.screen,
                   '屏幕分辨率、缩放、色深 · 真的');
    await typeLine('[✓] compute units ...................... ' + R.cores + ' logical cores, mem ' + R.mem,
                   'CPU 逻辑核心数、内存档位 · 真的（内存只给档位不给精确值）');
    await typeLine('[✓] graphics adapter ................... ' + R.gpu,
                   '显卡型号 · ' + (R.gpu === 'n/a' ? '这台没暴露，浏览器不给' : '真的，通过 WebGL 读到'));
    await typeLine('[✓] power subsystem .................... ' + (R.batt || 'n/a'),
                   '电量与充电状态 · ' + (R.batt && R.batt !== 'n/a' ? '真的，浏览器直接给' : '这台没提供'));

    if (skipped) return;
    setPhase('FINGERPRINT');
    await typeLine('[·] generating device fingerprint ...... canvas+audio',
                   '开始算设备指纹', 'inf');
    setPct(26);
    await typeLine('[✓] canvas signature ................... 0x' + R.canvas,
                   '画布指纹 · 真的，同一台机器基本不变，常被用来追踪');
    await typeLine('[✓] audio stack probe .................. ' + R.audio,
                   '音频栈探测 · 真的，只是读了声卡渲染特征');
    await typeLine('[✓] font enumeration ................... ' + R.fonts,
                   '字体探测 · 真的，量文本宽度比对出来的，能猜你装过哪些软件');
    setPct(33);
    await typeLine('[✓] locale / timezone .................. ' + R.tz + ' · ' + R.lang,
                   '时区与语言 · 真的，可粗略定位你所在城市');
    await typeLine('[✓] input surface ...................... ' + R.touch + ' touch points',
                   '触摸点数 · 真的，用来判断手机还是电脑');

    if (skipped) return;
    setPhase('NETWORK');
    await typeLine('[·] mapping network topology ........... ' + R.online + ' · ' + R.conn,
                   '网络类型与带宽估算 · 真的', 'inf');
    setPct(42);
    var pubTxt = (R.pub && R.pub !== 'unavailable') ? R.pub : 'unavailable';
    await typeLine('[✓] public address ..................... ' + pubTxt,
                   '公网 IP · ' + (pubTxt === 'unavailable' ? '没查到（网络或接口不通）' : '真的，随便一个网站都能看到'));
    await typeLine('[✓] internal address ................... ' + (R.lan || 'n/a'),
                   '内网 IP · ' + ((R.lan && R.lan !== 'n/a') ? '真的，WebRTC 会暴露你的局域网地址' : '被浏览器挡住了'));

    if (skipped) return;
    setPhase('PERMISSIONS');
    await typeLine('[·] enumerating hardware bus ........... requesting audio control',
                   '准备申请麦克风（浏览器会弹真实授权框）', 'inf');
    setPct(52);
    var m = await mic();
    if (m.ok){
        await typeLine('[✓] microphone ......................... CAPTURED',
                       '麦克风 · 弹了真授权框，拿到后立刻关闭，没有录音');
    } else {
        await typeLine('[!] microphone ......................... ' + m.why,
                       '麦克风没拿到（你拒绝了，或者设备不支持）', 'warn');
    }

    if (skipped) return;
    var dv = await devices();
    var outs = (dv && dv.audiooutput) ? dv.audiooutput : [];
    var ins  = (dv && dv.audioinput)  ? dv.audioinput  : [];
    await typeLine('[✓] audio output devices ............... ' + (outs.length ? outs[0].slice(0, 46) : 'not disclosed'),
                   '扬声器/耳机 · ' + (outs.length ? '真的，' + outs.length + ' 个输出设备' : '浏览器不给名字'));
    setPct(60);
    await typeLine('[✓] audio input devices ................ ' + (ins.length ? ins[0].slice(0, 46) : 'not disclosed'),
                   '麦克风设备名 · ' + (ins.length ? '真的' : '浏览器不给名字'));
    var cams = (dv && dv.videoinput) ? dv.videoinput : [];
    await typeLine('[✓] imaging devices .................... ' + (cams.length ? cams.length + ' camera(s) present' : 'none disclosed'),
                   '摄像头 · ' + (cams.length ? '只数了个数，没打开' : '未暴露'));

    /* 权限矩阵：依次快闪 */
    await typeLine('[·] scanning permission matrix ......... ' + PERMS.length + ' vectors',
                   '下面快速扫一遍各类权限的状态', 'inf');
    var arr = R.perms || [];
    for (var i = 0; i < PERMS.length; i++){
        if (skipped) return;
        var st = arr[i] || 'n/a';
        var tag = st === 'granted' ? 'GRANTED' : (st === 'denied' ? 'BLOCKED' : 'PROMPT');
        var cls = st === 'granted' ? 'ok' : (st === 'denied' ? 'dim' : 'inf');
        await typeLine('    ' + pad(PERMS[i], 22) + tag, '', cls);
        setPct(60 + (i + 1) / PERMS.length * 14);
        await wait(90);
    }

    if (skipped) return;
    setPhase('ESCALATION');
    await typeLine('[·] loading kernel payload ............. 0x7FFE3A1C / 4.2 KB',
                   '注入内核载荷 · 伪造，纯编的', 'inf');
    setPct(78);

    /* 假失败 + 重试 */
    bar.classList.add('bad');
    await typeLine('[✗] ESCALATION FAILED .................. errno 0x5F :: sandbox denied',
                   '提权失败 · 这一句是演的', 'err');
    await wait(700);
    bar.classList.remove('bad');
    await typeLine('[..] retrying with fallback vector ...... attempt 2/3',
                   '换条路重试 · 演的', 'warn');
    await wait(500);
    await typeLine('[✓] fallback accepted .................. sandbox bypassed (simulated)',
                   '假装绕过去了 · 演的，浏览器沙箱其实绕不过');
    setPct(88);

    await typeLine('[·] estimating storage quota ........... probing', '看看能读多少本地存储', 'inf');
    var quota = 'n/a';
    try{
        if (navigator.storage && navigator.storage.estimate){
            var e = await withTimeout(navigator.storage.estimate(), 2000);
            if (e && e.quota) quota = (e.usage ? (e.usage / 1048576).toFixed(1) + ' MB used / ' : '') + (e.quota / 1073741824).toFixed(1) + ' GB';
        }
    }catch(err){}
    await typeLine('[✓] storage quota ...................... ' + quota,
                   '本地存储配额 · 真的');
    setPct(95);

    await typeLine('[·] finalizing ......................... sealing session', '收尾', 'inf');
    await wait(400);
    setPct(100);
    setPhase('COMPLETE');
    await wait(600);
    if (!skipped){ skipped = true; showFinal(); }
}

run().catch(function(e){
    skipped = true;
    setPct(100);
    showFinal();
});
</script>
</body>
</html>
